<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>JavaScript Events</title>
  </head>
  <body>
    <h1 class="main-title">todo app</h1>
    <div class="container">
      <div class="left-side">
        <form action="" class="submit-form">
          <label for="title" class="form-label">TODO Title</label>
          <input type="text" id="title" class="form-input" />
          <label for="text" class="form-label">TODO Text</label>
          <input type="text" id="text" class="form-input" />
          <input type="button" value="Create TODO" class="submit-button" />
        </form>
      </div>
      <div class="right-side"></div>
    </div>
    <script src="./js/app.js"></script>
  </body>
</html>
